name: Format manager foundation

on:
  push:
    branches:
      - feat/2-manager-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Select Rust 1.95
        run: rustup override set 1.95.0

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
