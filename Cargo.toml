[workspace]
members = ["demoswarm", "demo-swarm"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/EffortlessMetrics/demoswarm-crate"
homepage = "https://effortlesssteven.com/demoswarm/"
authors = ["Steven Zimmerman <git@effortlesssteven.com>"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "forbid"
